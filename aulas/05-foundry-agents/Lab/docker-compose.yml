# Execução local do Deva3 — os dois serviços, do jeito que rodarão na Azure.
#
#   cp .env.exemplo .env   (e preencha)
#   docker compose up --build
#
#   API .......... http://localhost:8000/docs
#   Interface .... http://localhost:8501

services:

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: deva3-api:local
    container_name: deva3-api
    env_file: .env
    environment:
      AMBIENTE: local-compose
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/saude',timeout=4)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: deva3-web:local
    container_name: deva3-web
    env_file: .env
    environment:
      # Dentro da rede do compose, a API atende pelo nome do serviço.
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
