# Sobe a stack inteira na máquina do aluno, sem provisionar nada na Azure.
#   docker compose up --build
#   depois: http://localhost:8501
services:
  api:
    build: { context: ., dockerfile: api/Dockerfile }
    ports: ["8000:8000"]
    environment:
      DEVA_PASTA_LOCAL: /app/dados
      DEVA_SEGREDO_AUDITOR: ""     # vazio = modo aula, sem segredo
    volumes:
      - ./dados:/app/dados         # a memória sobrevive ao container

  web:
    build: { context: ., dockerfile: web/Dockerfile }
    ports: ["8501:8501"]
    environment:
      DEVA_API: http://api:8000
    depends_on: [api]
