name: Publicar imagem produtos-api no GHCR

# Por que este workflow existe:
#   A imagem do container da Aula 3 precisa ser construída fora do Azure.
#   O Cloud Shell não tem daemon Docker (só o cliente), e o ACR Tasks
#   ("az acr build") é bloqueado em contas Azure for Students com
#   TasksOperationsNotAllowed. O runner do GitHub resolve os dois problemas:
#   tem Docker de verdade e é linux/amd64 nativo, que é o que o ACI exige.
#
# Nenhum PAT é necessário: o GITHUB_TOKEN abaixo é emitido automaticamente
# para esta execução e expira quando ela termina.

on:
  # Botão manual na aba Actions — use na primeira publicação.
  workflow_dispatch:

  # Republica sozinho quando o código do container muda.
  push:
    branches: [main]
    paths:
      - "aulas/03-serverless-containers/lab/docker/**"
      - ".github/workflows/publicar-imagem-produtos-api.yml"

jobs:
  publicar:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # necessário para o push no GHCR

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      # Nomes de imagem em registries são obrigatoriamente minúsculos, e o
      # owner aqui é "IsaiasBritto". Sem esta conversão o push falharia com
      # "repository name must be lowercase".
      - name: Normalizar o owner para minúsculas
        id: owner
        run: echo "valor=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: aulas/03-serverless-containers/lab/docker
          # O ACI só roda linux/amd64. O runner já é amd64, mas deixamos
          # explícito para o build não mudar de comportamento se um dia o
          # workflow rodar em runner ARM.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.valor }}/produtos-api:v1
            ghcr.io/${{ steps.owner.outputs.valor }}/produtos-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Instruções finais
        run: |
          IMG="ghcr.io/${{ steps.owner.outputs.valor }}/produtos-api:v1"
          echo "### Imagem publicada" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$IMG" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Na PRIMEIRA publicação, torne o package público** — todo package novo no GHCR nasce privado, e o \`az acr import\` do aluno (anônimo) falharia com \`403 DENIED\`:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Packages → produtos-api → Package settings → Danger Zone → Change visibility → **Public**" >> "$GITHUB_STEP_SUMMARY"
